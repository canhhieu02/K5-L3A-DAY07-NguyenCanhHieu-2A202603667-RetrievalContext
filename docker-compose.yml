services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: day7_pgvector
    environment:
      POSTGRES_DB: day7_lab
      POSTGRES_USER: day7
      POSTGRES_PASSWORD: day7_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day7 -d day7_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pg_data:

